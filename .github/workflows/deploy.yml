name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Raspberry Pi
    runs-on: self-hosted
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Deploy
        working-directory: /home/pi/silver-happiness
        run: ./bin/deploy

      - name: Diagnose on failure
        if: failure()
        working-directory: /home/pi/silver-happiness
        run: ./bin/doctor || true
