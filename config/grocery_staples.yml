# Weekly staples — always good to have on hand for your regular meals.
# Edit this list anytime; recipes add per-meal detail on the grocery page.

produce:
  - Mâche or mesclun salad mix
  - Cherry tomatoes
  - Cucumbers
  - Red peppers
  - Red cabbage
  - Shredded carrots
  - Zucchini
  - Onions
  - Frozen stir-fry vegetable blend
  - Strawberries (or seasonal fruit)
  - Avocado
  - Lemons / limes
  - Fresh ginger (optional)

protein:
  - Firm tofu (Céréal Bio) — 2 blocks for batch prep
  - Soy yogurt (Sojasun Skyr)
  - Vegan protein powder (Platinum Innovation)
  - Canned black beans
  - Red lentils
  - Edamame frozen (optional)

carbs:
  - Rolled oats (gluten-free)
  - Quinoa
  - Brown rice
  - Corn tortillas (small)
  - Rice cakes
  - Wholegrain bread

pantry:
  - Chia seeds
  - Balsamic vinegar
  - Soy sauce
  - Salsa
  - Dijon mustard
  - Olive oil
  - Cumin, chili powder, cinnamon, nutmeg
  - Vegetable broth
  - Espresso / coffee
  - Soja sans sucre (Bjorg)

fats:
  - Koro peanut butter
  - Mixed nuts (optional snack)
