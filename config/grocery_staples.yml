# Weekly staples — always good to have on hand for your regular meals.
# Edit this list anytime; recipes add per-meal detail on the grocery page.

produce:
  - Mâche or mesclun salad mix
  - Baby spinach
  - Cherry tomatoes
  - Cucumbers
  - Red peppers
  - Zucchini
  - Onions
  - Frozen stir-fry vegetable blend
  - Strawberries (or seasonal fruit)
  - Avocado
  - Lemons / limes
  - Red cabbage (optional)
  - Shredded carrots (optional)
  - Fresh ginger (optional)

protein:
  - Firm tofu (Céréal Bio) — 2 blocks for batch prep
  - Soy yogurt (Sojasun Skyr)
  - Vegan protein powder (Platinum Innovation)
  - Canned black beans
  - Red lentils
  - Blond lentils (U) — smash tacos
  - Edamame frozen (optional)
  - Rice paper (bánh tráng) — Thai wraps
  - Button mushrooms — brochettes

carbs:
  - Rolled oats (gluten-free)
  - Quinoa
  - Barilla Fusilli Protein+ (dry — weigh 100 g portions)
  - Brown rice
  - Old El Paso Maïs et Blé tortillas (smash tacos)
  - Corn tortillas (small)
  - Rice cakes
  - Wholegrain bread

pantry:
  - Chia seeds
  - Balsamic vinegar
  - Soy sauce
  - Salsa
  - Dijon mustard
  - Olive oil
  - Cumin, chili powder, cinnamon, nutmeg, smoked paprika
  - Panzani Tomacouli Nature (tomato purée)
  - Tortilla Nachips (crush into smash-taco filling)
  - White or black beans (for BBQ bean brush)
  - Vegetable broth
  - Espresso / coffee
  - Soja sans sucre (Bjorg)

fats:
  - Koro peanut butter
  - Mixed nuts (optional snack)
